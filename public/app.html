<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>หลังบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/os.css">
<style>
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.side{background:#11241a;color:#d7e6dc;padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
nav.side .brand{font:700 17px var(--f-display);color:#fff;padding:4px 10px 14px}nav.side .brand small{display:block;color:#8fb09c;font:500 12px var(--f-body)}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#d7e6dc;text-decoration:none;font-weight:500}
nav.side a:hover{background:#1b3527}nav.side a[aria-current]{background:#24513b;color:#fff}
nav.side .grp{font-size:11px;color:#7d9c89;padding:14px 10px 4px;letter-spacing:.02em}
nav.side .badge{margin-left:auto;background:#e3a21a;color:#2a1b00;border-radius:999px;padding:0 7px;font-size:11px;font-weight:700}
nav.side .foot{margin-top:auto;padding:10px;font-size:12px;color:#8fb09c}
main{padding:22px clamp(16px,2vw,40px) 60px;width:100%;min-width:0}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}.ph p{margin:4px 0 0;color:var(--muted)}
.topbar{display:none}
@media (max-width:860px){.shell{grid-template-columns:1fr}nav.side{position:fixed;inset:0 30% 0 0;z-index:50;transform:translateX(-105%);transition:transform .2s;height:100%}
 body.nav-open nav.side{transform:none}.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#11241a;color:#fff;position:sticky;top:0;z-index:40}
 .topbar button{background:none;border:0;color:#fff;font-size:22px}main{padding:16px}}
/* inbox */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font:500 13px var(--f-body)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.ilist{display:grid;gap:8px}.irow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.irow:hover{border-color:var(--accent)}.irow img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:1000px){.detail{grid-template-columns:1fr}}
.imgbox{position:sticky;top:12px;background:#1d2420;border-radius:12px;overflow:hidden;height:min(82vh,780px);touch-action:none;user-select:none;cursor:zoom-in}
.imgbox.zoomed{cursor:grab}.imgbox.drag{cursor:grabbing}
.imgbox .zt{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.imgbox img{display:block;max-width:none;pointer-events:none}
.zctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zctl button{width:36px;height:36px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(20,30,24,.78);color:#fff;font:600 17px var(--f-body);cursor:pointer;display:grid;place-items:center}
.zctl button:hover{background:rgba(30,106,74,.9)}.zctl .pct{font:600 11px var(--f-body);color:#d7e6dc;text-align:center}
.zhint{position:absolute;left:10px;bottom:10px;right:56px;font-size:12px;color:#d7e6dc;background:rgba(20,30,24,.7);padding:4px 9px;border-radius:7px;width:max-content;max-width:calc(100% - 66px);pointer-events:none}
@media (max-width:1000px){.imgbox{position:relative;top:0;height:62vh}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fld{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}.fld.ok{border-left:4px solid var(--ok)}.fld.warn{border-left:4px solid #e3a21a;background:#fffaf0}.fld.crit{border-left:4px solid var(--crit);background:#fff6f5}
.fld label{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}.fld input{border:0;padding:2px 0;font-weight:600;font-size:15px;background:transparent}
.fld .why{font-size:11px;color:var(--muted);margin-top:2px}
.checks li{margin:3px 0}.ev{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin-left:4px}.ev div{margin:6px 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;background:#fff;cursor:pointer}.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.feat{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:900px){.feat{grid-template-columns:1fr 1fr}}
.cmp td{font-size:13px}.cmp td.diff{background:var(--warn-soft)}
pre.ocr{white-space:pre-wrap;max-height:360px;overflow:auto;background:var(--surface-2);border-radius:8px;padding:8px;font-size:12px}

/* same reading size as the farm dashboard: one large size for labels, notes and numbers */
:root{--xl:clamp(20px,1.7vw,26px)}
#main :is(h1,h2,h3,h4,p,span,b,strong,em,small,label,a,button,td,th,li,div,input,select,textarea,summary,pre,code){font-size:var(--xl)!important;line-height:1.35}
#main :is(h1,h2,h3,h4,summary){font-weight:800}
#main :is(input,select,textarea,button,.btn){min-height:48px}
#main textarea.mono,#main pre{font-size:calc(var(--xl)*.8)!important}
.side a,.side .grp,.side .brand,.topbar b{font-size:18px}
#main .feat{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
@media (max-width:640px){:root{--xl:19px}}
</style></head><body>
<div class="topbar"><button id="hamb" aria-label="เมนู">☰</button><b>หลังบ้าน <span class="fname"></span></b></div>
<div class="shell">
<nav class="side" id="side">
  <div class="brand" id="brand"><span class="fname"></span> OS<small>หลังบ้าน</small></div>
  <a href="/farm/">← กลับไปแดชบอร์ดฟาร์ม</a>
  <div class="grp">เอกสารเข้า</div>
  <a href="#inbox" data-r="inbox">📥 กล่องเอกสาร <span class="badge" id="nPend" hidden></span></a>
  <a href="#upload" data-r="upload">📷 ส่งรูปเอกสารเอง</a>
  <div class="grp admin">ตั้งค่า</div>
  <a href="#farm" data-r="farm" class="admin">🏠 ตั้งค่าฟาร์ม</a>
  <a href="#std" data-r="std" class="admin">📏 มาตรฐานและข้อมูลอ้างอิง</a>
  <a href="#accounts" data-r="accounts" class="admin">👥 บัญชีผู้ใช้</a>
  <a href="#line" data-r="line" class="admin">💬 LINE OA</a>
  <a href="#ai" data-r="ai" class="admin">✨ ตั้งค่า AI</a>
  <a href="#keys" data-r="keys" class="admin">🔑 API keys</a>
  <a href="#lab" data-r="lab" class="admin">🧪 ทดสอบ OCR เทียบเจ้า</a>
  <a href="#data" data-r="data" class="admin">🗂️ ข้อมูลในระบบ</a>
  <div class="foot"><span id="who"></span><br><a href="#" id="logout" style="color:#bfe0cb">ออกจากระบบ</a></div>
</nav>
<main id="main"><div class="empty"><span class="spin"></span></div></main>
</div>
<script type="module">
import { $, $$, esc, api, toast, shrink, confCls, thTime } from '/os.js';
let ME, FARMCFG = {}; try { const m = await api('GET', 'me'); ME = m.user; FARMCFG = m.config || {}; $$('.fname').forEach(e => e.textContent = m.farm || ''); document.title = 'หลังบ้าน ' + (m.farm || ''); } catch { }
if (!ME) location.replace('/?next=' + encodeURIComponent('/app' + location.hash));
const ADMIN = ME.role === 'owner' || ME.role === 'exec', STAFF = ADMIN || ME.role === 'office';
if (!STAFF) { document.body.innerHTML = '<div class="empty">บัญชีนี้ไม่มีสิทธิ์เข้าหลังบ้าน <a href="/farm/">กลับแดชบอร์ด</a></div>'; throw 0; }
$$('.admin').forEach(e => e.hidden = !ADMIN);
$('#who').textContent = `${ME.name} · ${ME.roleLabel}`;
$('#logout').onclick = async e => { e.preventDefault(); await api('POST', 'logout'); location.replace('/'); };
$('#hamb').onclick = () => document.body.classList.toggle('nav-open');
const M = $('#main');
const STATUS = { new: ['รับแล้ว', ''], reading: ['กำลังอ่าน', 'info'], scored: ['อ่านแล้ว', 'info'], asking: ['กำลังถามในกลุ่ม', 'info'], review: ['รอผู้บริหารตรวจ', 'warn'], error: ['อ่านไม่สำเร็จ', 'crit'], auto: ['บันทึกอัตโนมัติ', 'ok'], confirmed: ['คนยืนยันแล้วบันทึก', 'ok'], approved: ['ผู้บริหารอนุมัติ', 'ok'], rejected: ['ไม่บันทึก', ''], ignored: ['ไม่ใช่เอกสาร', ''], retake: ['ขอรูปใหม่', ''] };
const st = s => { const [l, c] = STATUS[s] || [s, '']; return `<span class="pill ${c}">${l}</span>`; };
const confPill = c => c == null ? '' : `<span class="pill ${confCls(c)}">มั่นใจ ${Math.round(c)}%</span>`;
let DOCT = {};
async function badge() { try { const r = await api('GET', 'intake?status=pending'); const n = (r.counts.review || 0) + (r.counts.error || 0); $('#nPend').hidden = !n; $('#nPend').textContent = n; DOCT = r.docTypes; } catch { } }

const R = {};
async function route() {
  document.body.classList.remove('nav-open');
  const [r, arg] = (location.hash.slice(1) || 'inbox').split('/');
  $$('nav.side a[data-r]').forEach(a => a.toggleAttribute('aria-current', a.dataset.r === r));
  M.innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try { await (R[r] || R.inbox)(arg); } catch (e) { M.innerHTML = `<div class="card"><b>เปิดหน้านี้ไม่ได้</b><p class="muted">${esc(e.message)}</p></div>`; }
}
addEventListener('hashchange', route);

/* ---------------- inbox ---------------- */
let inboxFilter = 'pending';
R.inbox = async id => {
  if (id) return detail(id);
  const r = await api('GET', 'intake' + (inboxFilter === 'all' ? '' : '?status=' + inboxFilter)); DOCT = r.docTypes;
  const c = r.counts, pend = (c.review || 0) + (c.error || 0) + (c.asking || 0);
  const F = [['pending', `ต้องดู (${pend})`], ['asking', `กำลังถามในกลุ่ม (${c.asking || 0})`], ['auto', `บันทึกอัตโนมัติ (${c.auto || 0})`], ['confirmed', `คนยืนยัน (${c.confirmed || 0})`], ['approved', `อนุมัติแล้ว (${c.approved || 0})`], ['all', 'ทั้งหมด']];
  M.innerHTML = `<div class="ph"><div><h1>กล่องเอกสาร</h1><p>รูปเอกสารที่ส่งเข้ามาทาง LINE หรืออัปโหลดเอง AI อ่านแล้วให้คะแนนความมั่นใจ ถ้ามั่นใจพอจะบันทึกเอง ถ้าไม่แน่ใจจะถามคนในกลุ่มก่อน แล้วค่อยส่งมาที่นี่</p></div><span class="sp"></span><a class="btn" href="#upload">📷 ส่งรูปเอง</a></div>
  <div class="chips">${F.map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${k === inboxFilter}">${l}</button>`).join('')}</div>
  <div class="ilist">${r.items.map(it => `<button class="irow" data-id="${it.id}"><img loading="lazy" src="/api/files/${it.file_id}" alt="">
    <div><b>${esc(DOCT[it.doc_type] || (it.doc_type === 'unknown' ? 'ไม่ใช่เอกสาร' : 'ยังไม่รู้ประเภท'))}</b>${it.head ? ` <span class="muted">${[it.head.house && 'เล้า ' + it.head.house, it.head.date, it.head.plate && 'ทะเบียน ' + it.head.plate].filter(Boolean).map(esc).join(' · ')}</span>` : ''}
    <br><small>${it.source === 'line' ? '💬 LINE' : '📷 อัปโหลด'} · ${esc(it.sender_name || '')} · ${thTime(it.created_at)}</small>${it.error ? `<br><small style="color:var(--crit)">${esc(it.error.slice(0, 140))}</small>` : ''}</div>
    <div style="text-align:right">${st(it.status)}<br>${confPill(it.confidence)}</div></button>`).join('') || '<div class="empty card">ไม่มีรายการ</div>'}</div>`;
  $$('.chip', M).forEach(b => b.onclick = () => { inboxFilter = b.dataset.f; R.inbox(); });
  $$('.irow', M).forEach(b => b.onclick = () => location.hash = 'inbox/' + b.dataset.id);
};
async function detail(id) {
  const { item: it, events, docTypes } = await api('GET', 'intake/' + id); DOCT = docTypes;
  const d = it.fields || {}; const conf = d.scoreConf || {}; const why = d.why || {}; const LBL = window.__LBL || {};
  const fieldBox = (k, v, key = k) => { const c = conf[key]; return `<div class="fld ${confCls(c)}"><label><span>${esc(LBL[k] || k)}</span>${c != null ? `<b>${Math.round(c)}%</b>` : ''}</label><input data-k="${esc(key)}" value="${esc(v ?? '')}">${why[key] ? `<div class="why">${esc(why[key].join(' · '))}</div>` : ''}</div>`; };
  const rowsKeys = [...new Set((d.rows || []).flatMap(r => Object.keys(r)))];
  const done = ['auto', 'confirmed', 'approved'].includes(it.status);
  M.innerHTML = `<div class="ph"><a class="btn ghost sm" href="#inbox">← กล่องเอกสาร</a><h1>${esc(docTypes[it.doc_type] || 'เอกสาร')}</h1>${st(it.status)}${confPill(it.confidence)}<span class="sp"></span>
    <small>${it.source === 'line' ? '💬 LINE' : '📷 อัปโหลด'} · ${esc(it.sender_name || '')} · ${thTime(it.created_at)}</small></div>
  <div class="detail"><div class="imgbox" id="ib"><div class="zt" id="zt"><img id="zimg" src="/api/files/${it.file_id}" alt="รูปเอกสาร"></div>
    <div class="zctl"><button type="button" data-z="in" title="ซูมเข้า">+</button><button type="button" data-z="out" title="ซูมออก">−</button><button type="button" data-z="rot" title="หมุนรูป 90°">⟳</button><button type="button" data-z="fit" title="ดูทั้งใบ">⤢</button><span class="pct" id="zpct">100%</span></div>
    <div class="zhint">คลิกจุดที่อยากดูเพื่อซูม · ลากเพื่อเลื่อน</div></div>
  <div class="grid">
    ${it.error ? `<div class="note warn">${esc(it.error)}</div>` : ''}
    <div class="card grid"><div class="row"><h3>ข้อมูลที่อ่านได้</h3><span class="sp"></span><label class="f" style="flex-direction:row;align-items:center">ประเภท <select id="dtype" style="width:auto">${Object.entries(docTypes).map(([k, l]) => `<option value="${k}" ${k === it.doc_type ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label></div>
      <small>สีเขียว = มั่นใจ ≥ 90% · เหลือง = 70–89% · แดง = ต่ำกว่า 70% หรือคำนวณไม่ลงตัว แก้ตัวเลขในช่องได้เลย แล้วกดอนุมัติ</small>
      <div class="fgrid" id="flds">${Object.entries(d.fields || {}).map(([k, v]) => fieldBox(k, v)).join('') || '<div class="muted">ยังไม่มีข้อมูล</div>'}</div>
      ${rowsKeys.length ? `<div class="tbl"><table id="rows"><thead><tr><th>#</th>${rowsKeys.map(k => `<th>${esc(LBL[k] || k)}</th>`).join('')}</tr></thead><tbody>${d.rows.map((r, i) => `<tr><td>${i + 1}</td>${rowsKeys.map(k => { const c = conf[`rows.${i}.${k}`]; return `<td class="${c != null && c < 90 ? 'diff' : ''}"><input data-r="${i}" data-k="${esc(k)}" value="${esc(r[k] ?? '')}" style="min-width:70px"></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
      ${(d.weights || []).length ? `<label class="f">น้ำหนักลังไข่ (กก.)<input id="wts" value="${esc(d.weights.join(' '))}"></label>` : ''}
      ${d.note ? `<div class="note">หมายเหตุจาก AI: ${esc(d.note)}</div>` : ''}
      <div class="row">${ADMIN ? `<button class="btn" id="bApprove">${done ? 'บันทึกทับด้วยค่าที่แก้' : '✓ อนุมัติและบันทึกเข้าระบบ'}</button><button class="btn ghost" id="bRe">อ่านใหม่ด้วย AI</button>${done ? '<button class="btn ghost danger" id="bUndo">ยกเลิกการบันทึก</button>' : '<button class="btn ghost danger" id="bRej">ไม่บันทึก</button>'}` : '<small>เฉพาะเจ้าของฟาร์ม/ผู้บริหารที่อนุมัติได้</small>'}</div><div class="status" id="sAct"></div>
    </div>
    ${(it.checks || []).length ? `<div class="card"><h3>ตรวจตัวเลข</h3><ul class="checks">${it.checks.map(c => `<li>${c.ok ? '✅' : '⚠️'} ${esc(c.msg)}</li>`).join('')}</ul></div>` : ''}
    ${it.committed?.paths?.length ? `<div class="card"><h3>บันทึกไว้ที่</h3><small class="mono">${it.committed.paths.map(esc).join('<br>')}</small>${it.committed.cross ? `<h3 style="margin-top:10px">เทียบใบชั่งกับใบหน้าฟาร์ม</h3><div class="tbl"><table><tr><th>ทะเบียน</th><th>ใบหน้าฟาร์ม (ตัว)</th><th>ใบชั่ง (ตัว)</th><th>สุทธิ (กก.)</th><th></th></tr>${it.committed.cross.map(x => `<tr><td>${esc(x.plate)}</td><td>${x.gateBirds ?? '–'}</td><td>${x.slipBirds ?? '–'}</td><td>${x.slipNetKg ?? '–'}</td><td>${x.match ? '✅' : '⚠️ ไม่ตรง'}</td></tr>`).join('')}</table></div>` : ''}</div>` : ''}
    ${it.ocr_text ? `<details class="card"><summary>ข้อความที่ OCR อ่านได้</summary><pre class="ocr">${esc(it.ocr_text)}</pre></details>` : ''}
    <div class="card"><h3>ประวัติ</h3><div class="ev">${events.map(e => `<div><b>${thTime(e.at)}</b> ${esc(e.actor)} · ${esc(EVT[e.action] || e.action)} ${e.detail && Object.keys(e.detail).length ? `<span class="mono">${esc(JSON.stringify(e.detail).slice(0, 160))}</span>` : ''}</div>`).join('')}</div></div>
  </div></div>`;
  zoomer($('#ib'), $('#zt'), $('#zimg'), $('#zpct'));
  const collect = () => {
    const fields = {}; $$('#flds input').forEach(i => { if (i.value.trim() !== '') fields[i.dataset.k] = i.value.trim(); });
    const rows = []; $$('#rows input').forEach(i => { (rows[+i.dataset.r] = rows[+i.dataset.r] || {})[i.dataset.k] = i.value.trim(); });
    const weights = $('#wts') ? $('#wts').value.split(/[\s,]+/).map(Number).filter(n => n > 0) : d.weights;
    return { fields, rows, weights, doc_type: $('#dtype').value };
  };
  const act = async (fn, msg) => { $('#sAct').className = 'status'; $('#sAct').innerHTML = '<span class="spin"></span> กำลังทำ…'; try { await fn(); toast(msg); await badge(); detail(id); } catch (e) { $('#sAct').className = 'status err'; $('#sAct').textContent = e.message; } };
  if (!ADMIN) return;
  $('#bApprove').onclick = () => act(() => api('POST', `intake/${id}/approve`, { data: collect() }), 'บันทึกเข้าระบบแล้ว');
  $('#bRe').onclick = () => act(() => api('POST', `intake/${id}/reprocess`, { doc_type: $('#dtype').value }), 'อ่านใหม่แล้ว');
  $('#bRej') && ($('#bRej').onclick = () => act(() => api('POST', `intake/${id}/reject`, {}), 'ทำเครื่องหมายว่าไม่บันทึก'));
  $('#bUndo') && ($('#bUndo').onclick = () => confirmAsk('ลบข้อมูลที่รายการนี้บันทึกไว้ออกจากระบบ?') && act(() => api('POST', `intake/${id}/undo`, {}), 'ยกเลิกการบันทึกแล้ว'));
}
const confirmAsk = m => window.confirm(m);
// photo viewer: click a spot to zoom into it, drag to pan, wheel / pinch to zoom, rotate for sideways photos
function zoomer(box, layer, img, pct) {
  let s = 1, tx = 0, ty = 0, rot = 0, base = 1, nw = 0, nh = 0;
  const pts = new Map(); let moved = false, start = null, pinch = null;
  const dims = () => (rot % 180 ? [nh, nw] : [nw, nh]);
  function apply() {
    const [w, h] = dims(), W = box.clientWidth, H = box.clientHeight, sw = w * base * s, sh = h * base * s;
    tx = sw <= W ? (W - sw) / 2 : Math.min(0, Math.max(W - sw, tx));

R.upload = async () => {
  M.innerHTML = `<div class="ph"><div><h1>ส่งรูปเอกสารเอง</h1><p>ใช้ตอนที่ไม่ได้ส่งผ่าน LINE เช่น สแกนย้อนหลัง เลือกหลายรูปพร้อมกันได้ ระบบจะอ่านทีละใบ</p></div></div>
  <div class="card grid"><label class="f" style="max-width:360px">ประเภทเอกสาร<select id="ut"><option value="">ให้ AI ดูเองว่าเป็นใบอะไร</option>${Object.entries(DOCT).map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select></label>
  <label class="drop" id="drop"><input type="file" id="uf" accept="image/*" multiple hidden><b>แตะเพื่อเลือกรูป</b> หรือลากรูปมาวางตรงนี้<br><small>รูปจะถูกย่อให้เล็กลงก่อนส่ง ตัวหนังสือยังชัดเหมือนเดิม</small></label>
  <div class="ilist" id="ures"></div></div>`;
  const run = async files => {
    for (const f of files) {
      const row = document.createElement('div'); row.className = 'irow'; $('#ures').prepend(row);
      const img = await shrink(f); row.innerHTML = `<img src="${img.preview}"><div><b>${esc(f.name)}</b><br><small><span class="spin"></span> กำลังอ่าน… ปกติ 10–60 วินาที</small></div><div></div>`;

        row.innerHTML = `<img src="${img.preview}"><div><b>${esc(f.name)}</b><br><small>${r.status === 'auto' ? 'บันทึกเข้าระบบแล้ว' : r.status === 'review' ? 'รอตรวจ กดเพื่อดู/แก้' : esc(r.error || '')}</small></div><div>${st(r.status)}<br>${confPill(r.confidence)}</div>`;

    <div class="grid g3">${num('eggsPerTray', c.eggsPerTray, 'ไข่ต่อแผง (ฟอง)', '1')}${num('traysPerCrate', c.traysPerCrate, 'แผงต่อลัง', '1')}${num('trayKg', c.trayKg, 'แผงเปล่าต่อลัง (กก.)', '0.1', 'ใช้หักออกตอนคิดน้ำหนักไข่ต่อฟอง')}</div>
    <h3>รอบการเลี้ยง</h3>
    <div class="grid g3">${num('restDays', c.restDays, 'พักเล้า (วัน)', '1')}${num('moveWeek', c.moveWeek, 'ย้ายไก่เล็กขึ้นกรง (สัปดาห์)', '1')}${num('depopWeek', c.depopWeek, 'ปลดไก่ (สัปดาห์)', '1')}</div>
    <h3>ส่งสรุปประจำวันทาง LINE</h3>
    ${num('summaryHour', c.summaryHour, 'ส่งได้ตั้งแต่เวลา (ชั่วโมง 0–23)', '1', 'ระบบบน Vercel แพ็กเกจฟรีเรียกส่งวันละครั้งตอน 18:00 ถ้าตั้งหลัง 18 นาฬิกา ต้องมีระบบอื่น (เช่น n8n) เรียกลิงก์ส่งสรุปทุกชั่วโมง')}
    <h3>เกณฑ์แจ้งเตือน</h3>
    <div class="grid g2">${AL.map(([k, l]) => num('alerts.' + k, A[k], l)).join('')}</div>
    <h3>ชื่อจุดต่างๆ บนผังฟาร์ม</h3>
    <label class="f">แถบด้านบน (บรรทัดละหนึ่งอย่าง เรียงจากบนลงล่าง)<textarea data-k="map.top" rows="2">${esc((c.map.top || []).join('\n'))}</textarea></label>
    <div class="grid g3">${[['left', 'ด้านซ้าย'], ['right', 'ด้านขวา'], ['road', 'ถนน'], ['pond', 'บ่อน้ำกลางฟาร์ม'], ['gate', 'จุดฆ่าเชื้อ'], ['entrance', 'ทางเข้า']].map(([k, l]) => `<label class="f">${l}<input data-k="map.${k}" value="${esc(c.map[k] || '')}"></label>`).join('')}</div>
    <label class="chk"><input type="checkbox" data-k="map.showStock" ${c.map.showStock !== false ? 'checked' : ''}>แสดงห้อง Stock บนผัง</label>
    <div class="row"><button class="btn" type="submit">บันทึกค่าฟาร์ม</button><span class="status" id="sFarm"></span></div>
   </form>
   <div class="card grid"><h3>เล้าในฟาร์ม</h3><p class="muted">ประเภทเล้ากำหนดว่าเล้าไปอยู่ฝั่งไก่ไข่หรือไก่เล็กในทุกหน้า ลำดับบนผัง: ไก่เล็กเรียงซ้ายไปขวาทีละ 2 เล้า ไก่ไข่เรียงจากบนลงล่าง เว้นว่างไว้ให้ระบบเรียงตามเลขเล้า สายพันธุ์ วันเกิด และจำนวนไก่ แก้ในหน้าเล้าและไก่ของแดชบอร์ด</p>
    <div class="tbl"><table><tr><th>เล้า</th><th>ประเภท</th><th>จำนวนชั้น</th><th>ลำดับบนผัง</th><th></th></tr><tbody id="hBody">${houses.sort((a, b) => a.no - b.no).map(hRow).join('')}</tbody></table></div>
    <div class="row"><input id="hNew" type="number" min="1" placeholder="เลขเล้าใหม่" style="width:140px"><select id="hNewT"><option value="layer">ไก่ไข่</option><option value="pullet">ไก่เล็ก</option></select><button class="btn ghost" id="hAdd">เพิ่มเล้า</button><span class="status" id="sHouse"></span></div>
   </div>
  </div>`;
  $('#fFarm').onsubmit = async e => {
    e.preventDefault(); const b = { name: e.target.name.value, alerts: {}, map: {} };
    $$('#fFarm [data-k]').forEach(i => { const k = i.dataset.k; const v = i.type === 'checkbox' ? i.checked : k === 'map.top' ? i.value.split('\n').map(s => s.trim()).filter(Boolean) : i.value;
      if (k.startsWith('alerts.')) b.alerts[k.slice(7)] = v; else if (k.startsWith('map.')) b.map[k.slice(4)] = v; else b[k] = v; });
    try { await api('POST', 'settings/farm', b); $('#sFarm').className = 'status ok'; $('#sFarm').textContent = 'บันทึกแล้ว'; $$('.fname').forEach(x => x.textContent = b.name); } catch (er) { $('#sFarm').className = 'status err'; $('#sFarm').textContent = er.message; }
  };
  const save = async (no, data) => { try { await api('POST', 'db/write', { op: 'update', path: 'houses/h' + no, data }); $('#sHouse').className = 'status ok'; $('#sHouse').textContent = `บันทึกเล้า ${no} แล้ว`; } catch (er) { $('#sHouse').className = 'status err'; $('#sHouse').textContent = er.message; } };
  $('#hBody').addEventListener('change', e => { const tr = e.target.closest('tr'); const no = +tr.dataset.no; const n = v => v === '' ? null : +v;
    if (e.target.matches('.hType')) save(no, { type: e.target.value }); if (e.target.matches('.hTiers')) save(no, { tiers: n(e.target.value) }); if (e.target.matches('.hOrd')) save(no, { mapOrder: n(e.target.value) }); });
  $('#hBody').addEventListener('click', async e => { const tr = e.target.closest('tr'); if (!tr) return; const no = +tr.dataset.no;
    if (e.target.matches('.hDel')) { if (!confirmAsk(`ถอดเล้า ${no} ออกจากทุกหน้า? ข้อมูลเก่าของเล้านี้ยังเก็บไว้`)) return; await save(no, { status: 'removed' }); R.farm(); }
    if (e.target.matches('.hBack')) { await save(no, { status: 'ready' }); R.farm(); } });
  $('#hAdd').onclick = async () => { const no = +$('#hNew').value; if (!(no > 0)) return; if (houses.some(h => +h.no === no && h.status !== 'removed')) { $('#sHouse').textContent = 'มีเล้านี้แล้ว'; return; }
    await save(no, { no, type: $('#hNewT').value, status: 'ready', birds: 0 }); R.farm(); };
};


/* ---------------- standards & reference tables ---------------- */
// tables are edited as tab-separated text, so a block copied from Excel can be pasted straight in
const TSV = { parse: (txt, keys) => txt.split('\n').map(l => l.replace(/\r$/, '')).filter(l => l.trim()).map(l => l.split(/\t|\s{2,}|,(?=\s*\d)/)).filter(c => !isNaN(parseFloat(c[0]))).map(c => Object.fromEntries(keys.map((k, i) => [k, c[i] == null ? '' : c[i].trim()]))),
  out: (rows, keys) => rows.map(r => keys.map(k => r[k] ?? '').join('\t')).join('\n') };
R.std = async () => {
  const { standards, reference: ref } = await api('GET', 'settings/reference');
  const SK = ['w', 'hd', 'ew', 'surv', 'cum', 'bwMin', 'bwMax'], SH = 'สัปดาห์\t%ไข่ (Hen-day)\tน้ำหนักไข่ (กรัม)\t%เลี้ยงรอด\tไข่สะสมต่อแม่\tน้ำหนักตัวต่ำสุด (กรัม)\tน้ำหนักตัวสูงสุด (กรัม)';
  const tbl = (id, head, rows, keys, h = 10) => `<label class="f">${head.split('\t').join(' · ')}<textarea id="${id}" rows="${h}" class="mono" spellcheck="false">${esc(TSV.out(rows || [], keys))}</textarea></label>`;
  const L = ref.lists || {};
  M.innerHTML = `<div class="ph"><div><h1>มาตรฐานและข้อมูลอ้างอิง</h1><p>ตารางมาตรฐานสายพันธุ์ โปรแกรมวัคซีน ระยะอาหาร แสงและอุณหภูมิ และรายการตัวเลือกในฟอร์ม แก้ที่นี่แล้วทุกหน้าใช้ค่าใหม่ทันที ตารางวางจาก Excel ได้เลย (คัดลอกทั้งแถว ไม่ต้องมีหัวตาราง)</p></div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));align-items:start">
   <div class="card grid"><h3>มาตรฐานสายพันธุ์</h3>
    <div class="row"><select id="sBreed">${standards.map(s => `<option value="${esc(s.id)}">${esc(s.breed)}</option>`).join('')}<option value="__new">+ เพิ่มสายพันธุ์ใหม่</option></select></div>
    <div id="sForm" class="grid"></div></div>
   <div class="card grid"><h3>โปรแกรมวัคซีน</h3>${tbl('tVac', 'อายุ (วัน)\tชื่อวัคซีน', ref.vacProg, ['day', 'name'], 8)}
    <h3>ระยะอาหาร</h3>${tbl('tFeed', 'สัปดาห์เริ่ม\tสัปดาห์สิ้นสุด\tชื่ออาหาร\tโปรตีน (%)\tแคลเซียม (%)', ref.feedPhases, ['fromWeek', 'toWeek', 'name', 'protein', 'calcium'], 7)}
    <h3>แสงและอุณหภูมิตามอายุ</h3>${tbl('tRear', 'จากวันที่\tถึงวันที่\tชั่วโมงแสง\tอุณหภูมิ (°C)', ref.rearing, ['fromDay', 'toDay', 'light', 'temp'], 7)}
    <h3>ตัวเลือกในฟอร์ม (บรรทัดละหนึ่งอย่าง)</h3>
    <div class="grid g2">${[['vacs', 'ชื่อวัคซีน'], ['vacMethods', 'วิธีให้วัคซีน'], ['deathCauses', 'สาเหตุไก่ตาย'], ['repairCats', 'หมวดงานซ่อม'], ['dungUnits', 'หน่วยขายขี้ไก่']].map(([k, l]) => `<label class="f">${l}<textarea data-list="${k}" rows="5">${esc((L[k] || []).join('\n'))}</textarea></label>`).join('')}</div>
    <details><summary>คู่มือสายพันธุ์และรายการยา-วัสดุ (สำหรับคนที่แก้ JSON เป็น)</summary>
     <label class="f">คู่มือสายพันธุ์<textarea id="tGuide" rows="8" class="mono" spellcheck="false">${esc(JSON.stringify(ref.breedInfo || {}, null, 1))}</textarea></label>
     <label class="f">รายการยาและวัสดุที่ควรมี<textarea id="tSup" rows="6" class="mono" spellcheck="false">${esc(JSON.stringify(ref.supplies || [], null, 1))}</textarea></label></details>
    <div class="row"><button class="btn" id="bRef">บันทึกตารางด้านบนทั้งหมด</button><span class="status" id="sRef"></span></div></div>
  </div>`;
  const form = id => { const s = standards.find(x => x.id === id) || { breed: '', src: '', approx: false, rows: [] };
    $('#sForm').innerHTML = `<label class="f">ชื่อสายพันธุ์ (ต้องตรงกับชื่อที่ตั้งในหน้าเล้า)<input id="sName" value="${esc(s.breed)}" ${id === '__new' ? '' : 'readonly'}></label>
      <label class="f">ที่มาของตัวเลข<input id="sSrc" value="${esc(s.src || '')}"></label>
      <label class="chk"><input type="checkbox" id="sApprox" ${s.approx ? 'checked' : ''}>เป็นค่าประมาณ (แสดงคำเตือนบนกราฟ)</label>
      ${tbl('sRows', SH, s.rows, SK, 16)}
      <small>ช่องที่ไม่มีตัวเลขเว้นว่างได้ Hen-house มาตรฐานจะคำนวณได้เมื่อมีคอลัมน์ %เลี้ยงรอด</small>
      <div class="row"><button class="btn" id="bStd">บันทึกมาตรฐานนี้</button><span class="status" id="sStd"></span></div>`;
    $('#bStd').onclick = async () => { try { const rows = TSV.parse($('#sRows').value, SK); const r = await api('POST', 'settings/standard', { id: id === '__new' ? '' : id, breed: $('#sName').value, src: $('#sSrc').value, approx: $('#sApprox').checked, rows });
      $('#sStd').className = 'status ok'; $('#sStd').textContent = `บันทึก ${r.rows} สัปดาห์แล้ว`; if (id === '__new') R.std(); } catch (e) { $('#sStd').className = 'status err'; $('#sStd').textContent = e.message; } }; };
  $('#sBreed').onchange = e => form(e.target.value); form($('#sBreed').value);
  $('#bRef').onclick = async () => { try {
    const n = v => v === '' ? null : Number(v);
    const body = { vacProg: TSV.parse($('#tVac').value, ['day', 'name']).map(r => ({ day: n(r.day), name: r.name })),
      feedPhases: TSV.parse($('#tFeed').value, ['fromWeek', 'toWeek', 'name', 'protein', 'calcium']).map(r => ({ fromWeek: n(r.fromWeek), toWeek: n(r.toWeek), name: r.name, protein: n(r.protein), calcium: n(r.calcium) })),
      rearing: TSV.parse($('#tRear').value, ['fromDay', 'toDay', 'light', 'temp']).map(r => ({ fromDay: n(r.fromDay), toDay: n(r.toDay), light: n(r.light), temp: r.temp })),
      lists: Object.fromEntries($$('[data-list]').map(t => [t.dataset.list, t.value.split('\n').map(s => s.trim()).filter(Boolean)])),
      breedInfo: JSON.parse($('#tGuide').value || '{}'), supplies: JSON.parse($('#tSup').value || '[]') };
    await api('POST', 'settings/reference', body); $('#sRef').className = 'status ok'; $('#sRef').textContent = 'บันทึกแล้ว';
  } catch (e) { $('#sRef').className = 'status err'; $('#sRef').textContent = e instanceof SyntaxError ? 'JSON ในคู่มือหรือรายการยาไม่ถูกต้อง' : e.message; } };
};

/* ---------------- data ---------------- */
R.data = async () => {
  const s = await api('GET', 'admin/stats'); const demo = s.collections.reduce((a, c) => a + c.demo, 0);
  M.innerHTML = `<div class="ph"><div><h1>ข้อมูลในระบบ</h1><p>จำนวนข้อมูลแต่ละหมวด ข้อมูลตัวอย่าง (ชื่อลงท้าย "(ตัวอย่าง)") ใส่ไว้ให้ลองใช้ ลบออกได้ทีเดียวก่อนเริ่มใช้จริง</p></div></div>
  <div class="row" style="margin-bottom:12px"><button class="btn ghost" id="bSeed">ใส่ข้อมูลตัวอย่าง</button><button class="btn ghost danger" id="bClear" ${demo ? '' : 'disabled'}>ลบข้อมูลตัวอย่างทั้งหมด (${demo})</button><button class="btn ghost" id="bSweep">ส่งคำถามค้างให้ผู้บริหารตอนนี้</button></div>
  <div class="tbl"><table><tr><th>หมวด</th><th>ทั้งหมด</th><th>ตัวอย่าง</th></tr>${s.collections.map(c => `<tr><td class="mono">${esc(c.collection)}</td><td>${c.n}</td><td>${c.demo || ''}</td></tr>`).join('')}</table></div><div id="stor" class="card" style="margin-top:14px"><span class="spin"></span></div>`;
  const MB = b => (Number(b) / 1048576).toLocaleString('th-TH', { maximumFractionDigits: 1 }) + ' MB';
  const paint = async () => { const g = await api('GET', 'admin/storage'); const f = g.files;
    $('#stor').innerHTML = `<h2 style="margin-top:0">ที่เก็บรูปและไฟล์เสียง</h2>
      <p>ฐานข้อมูลใช้ไปทั้งหมด <b>${MB(g.dbBytes)}</b> · ไฟล์ทั้งหมด ${f.n.toLocaleString('th-TH')} ไฟล์ (${MB(f.bytes)})</p>
      <p>ตอนนี้เก็บไฟล์ไว้ที่: <b>${g.store === 'blob' ? 'ที่เก็บไฟล์แยก (Vercel Blob) ✅' : 'ในฐานข้อมูล ⚠️'}</b>${f.in_db ? ` · ยังค้างในฐานข้อมูล ${f.in_db} ไฟล์ (${MB(f.db_bytes)})` : ''}</p>
      ${g.store === 'blob' ? (f.in_db ? '<button class="btn" id="bMig">ย้ายไฟล์ที่ค้างออกจากฐานข้อมูล</button> <span class="status" id="sMig"></span>' : '') : '<p class="status">ยังไม่ได้ต่อที่เก็บไฟล์ ไปที่ Vercel → โปรเจกต์นี้ → Storage → Create → Blob → เลือก Private แล้วกด Connect กับโปรเจกต์ จากนั้น Redeploy หนึ่งครั้ง</p>'}`;
    const b = $('#bMig'); if (b) b.onclick = async () => { b.disabled = true; let r; do { r = await api('POST', 'admin/storage/migrate'); $('#sMig').textContent = `ย้ายแล้ว เหลือ ${r.left} ไฟล์`; } while (r.moved && r.left); toast('ย้ายไฟล์เสร็จ'); paint(); }; };
  paint().catch(e => { $('#stor').textContent = e.message; });
  $('#bSeed').onclick = async () => { const r = await api('POST', 'admin/seed'); toast(`เพิ่ม ${r.added} รายการ`); R.data(); };
  $('#bClear').onclick = async () => { if (!confirmAsk(`ลบข้อมูลตัวอย่าง ${demo} รายการ? ข้อมูลจริงไม่ถูกลบ`)) return; const r = await api('POST', 'admin/clear-demo'); toast(`ลบ ${r.removed} รายการ`); R.data(); };
  $('#bSweep').onclick = async () => { const r = await api('POST', 'cron/sweep'); toast(`ส่งให้ผู้บริหาร ${r.escalated} รายการ`); };
};

try { window.__LBL = (await api('GET', 'labels')).labels; } catch { window.__LBL = {}; }
await badge(); route();
</script></body></html>
