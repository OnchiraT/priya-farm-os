<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/os.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(1200px 500px at 50% -10%,#dcefe4,transparent),var(--bg)}
.box{width:100%;max-width:380px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;justify-content:center}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font:700 20px var(--f-display)}
form{display:flex;flex-direction:column;gap:12px}.btn{justify-content:center;padding:11px}
</style></head><body>
<div class="box">
  <div class="brand"><div class="logo" id="farmLogo">F</div><div><h1 id="farmName">Farm OS</h1><small>ระบบจัดการฟาร์มไข่</small></div></div>
  <div class="card" id="loginCard" hidden>
    <h2 style="margin-bottom:12px">เข้าสู่ระบบ</h2>
    <form id="fLogin">
      <label class="f">ชื่อผู้ใช้<input name="username" autocomplete="username" required autocapitalize="none"></label>
      <label class="f">รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn">เข้าสู่ระบบ</button><div class="status" id="sLogin"></div>
    </form>
    <small>ลืมรหัสผ่าน ให้เจ้าของฟาร์มรีเซ็ตให้ในหน้าบัญชีผู้ใช้</small>
  </div>
  <div class="card" id="setupCard" hidden>
    <h2>ตั้งค่าครั้งแรก</h2><p class="muted" style="margin:4px 0 12px">ยังไม่มีบัญชีในระบบ สร้างบัญชีเจ้าของฟาร์มก่อน บัญชีนี้จะเพิ่มคนอื่นและตั้งค่า LINE กับ AI ได้</p>
    <form id="fSetup">
      <label class="f">ชื่อฟาร์ม<input name="farmName" placeholder="เช่น ฟาร์มไข่ของฉัน" required></label>
      <label class="f">ชื่อที่แสดง<input name="display_name" placeholder="เช่น พี่นันท์" required></label>
      <label class="f">ชื่อผู้ใช้ (ภาษาอังกฤษตัวเล็ก)<input name="username" autocapitalize="none" pattern="[a-z0-9._\-]{3,32}" required></label>
      <label class="f">รหัสผ่าน (อย่างน้อย 6 ตัว)<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
      <button class="btn">สร้างบัญชีเจ้าของฟาร์ม</button><div class="status" id="sSetup"></div>
    </form>
  </div>
</div>
<script type="module">
import { $, api } from '/os.js';
const next = new URLSearchParams(location.search).get('next') || '/farm/';
let me; try { me = await api('GET', 'me'); } catch (e) { document.body.innerHTML = `<div class="card" style="max-width:520px"><h2>เชื่อมต่อฐานข้อมูลไม่ได้</h2><p class="muted">${e.message}</p></div>`; throw e; }
if (me.farm) { $('#farmName').textContent = me.farm; $('#farmLogo').textContent = me.farm.trim()[0]; document.title = me.farm + ' OS'; }
if (me.user) location.replace(next);
else if (me.setupNeeded) $('#setupCard').hidden = false; else $('#loginCard').hidden = false;
const go = (form, path, st) => form.addEventListener('submit', async ev => {
  ev.preventDefault(); const b = Object.fromEntries(new FormData(form)); const btn = form.querySelector('button'); btn.disabled = true; $(st).className = 'status'; $(st).textContent = 'กำลังตรวจสอบ…';
  try { await api('POST', path, b); location.replace(path === 'setup' ? '/app#line' : next); } catch (e) { $(st).className = 'status err'; $(st).textContent = e.message; btn.disabled = false; }
});
go($('#fLogin'), 'login', '#sLogin'); go($('#fSetup'), 'setup', '#sSetup');
</script></body></html>
